<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} · 小红书图文</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0eee6;color:#222722;font:16px/1.55 Arial,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1070px,calc(100% - 40px));margin:28px auto 50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:clamp(24px,5vw,90px);align-items:start}figure{margin:0}figure img{aspect-ratio:3/4;display:block;width:auto;max-width:100%;max-height:75vh;margin:auto;touch-action:pan-y}h1{font-size:clamp(37px,4.6vw,70px);letter-spacing:-.055em;line-height:1.1;margin:10px 0 24px}.imprint{font:14px monospace}.actions,figcaption{display:flex;gap:10px;align-items:center;flex-wrap:wrap}figcaption{justify-content:center;margin-top:12px}button,a{font:inherit;color:inherit}button,.download{min-height:44px;padding:9px 16px;border:1px solid #7b8176;background:transparent;border-radius:24px;cursor:pointer;text-decoration:none}.primary{background:#20382c;color:#fff;border-color:#20382c}button:disabled{opacity:.4;cursor:default}output{min-width:5ch;text-align:center;font:16px monospace}.copy{white-space:pre-wrap;line-height:1.8;margin-top:24px;border-top:1px solid #a6ab9f;padding-top:18px}.credit,small{color:#555e53;font-size:13px}:focus-visible{outline:3px solid #315dca;outline-offset:3px}@media(max-width:680px){main{display:flex;flex-direction:column;width:min(100% - 28px,490px);margin:14px auto;gap:24px}figure,section{width:100%}figure img{max-height:66vh}h1{font-size:38px}}</style></head><body><main><figure><img id="picture" alt=""><figcaption><button id="prev" aria-label="上一张">←</button><output aria-live="polite"></output><button id="next" aria-label="下一张">→</button><a class="download" id="current">下载这张</a></figcaption></figure><section><p class="imprint"></p><h1></h1><div class="actions"><a class="download primary" href="images.zip" download>下载整套图文</a><button id="copy">复制文案</button></div><p class="copy"></p><p class="credit"></p><small role="status"></small></section></main>
<script type="application/json" id="brief">{{DATA}}</script><script>
const d=JSON.parse(document.querySelector('#brief').textContent), q=s=>document.querySelector(s), img=q('#picture');let page=0,start=null;
function show(n){page=Math.max(0,Math.min(d.pages.length-1,n));const item=d.pages[page];img.src=item.src;img.alt=item.alt;q('output').value=(page+1)+' / '+d.pages.length;q('#prev').disabled=page===0;q('#next').disabled=page===d.pages.length-1;q('#current').href=item.src;q('#current').download=item.name}
q('h1').textContent=d.title;q('.copy').textContent=d.caption;q('.credit').textContent=d.credit;q('.imprint').textContent=d.imprint;q('#prev').onclick=()=>show(page-1);q('#next').onclick=()=>show(page+1);
q('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(d.caption);q('[role=status]').textContent='文案已复制'}catch{const range=document.createRange();range.selectNodeContents(q('.copy'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);q('[role=status]').textContent='已选中文案，可使用系统复制。'}};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(page+(e.key==='ArrowRight'?1:-1))}});
img.addEventListener('touchstart',e=>{start=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});img.addEventListener('touchend',e=>{if(!start)return;const x=e.changedTouches[0].clientX-start[0],y=e.changedTouches[0].clientY-start[1];if(Math.abs(x)>45&&Math.abs(x)>Math.abs(y))show(page+(x<0?1:-1));start=null},{passive:true});show(0);
</script></body></html>
