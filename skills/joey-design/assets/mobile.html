<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{--bg:#eeeee6;--ink:#17261f;--muted:#47554c;--line:#abb4a6;--action:#244632;--on:#f9ffeb;--tile:#dbe3d2;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter","PingFang SC","Microsoft YaHei",Arial,sans-serif}body.afterdark{--bg:#211b19;--ink:#f7edda;--muted:#d4bfaa;--line:#67544a;--action:#ffd4a1;--on:#332116;--tile:#342923;color-scheme:dark}button,a,input{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{text-underline-offset:4px}main:focus{outline:0}button:focus-visible,a:focus-visible{outline:3px solid #518cf9;outline-offset:3px}img{width:100%;display:block;object-fit:cover}h1,h2,h3,p{margin:0}button{border:0;background:none}.shell{width:min(1120px,calc(100% - 64px));margin:auto}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:18px}.word{font:800 20px/1.1 "Arial",sans-serif;letter-spacing:-.065em;text-decoration:none}.top .brand-cn{font:500 14px/1.4 "PingFang SC",sans-serif;letter-spacing:.04em;margin-left:10px;color:var(--muted)}.top nav,.bottom{display:flex;gap:6px}.top nav a,.bottom a{display:inline-flex;align-items:center;min-height:44px;padding:8px 13px;font-size:14px;text-decoration:none;gap:6px}.top a[aria-current=page],.bottom a[aria-current=page]{color:var(--on);background:var(--action);border-radius:24px}.hero{display:grid;grid-template-columns:.85fr 1.2fr;align-items:center;gap:48px;padding:32px 0 44px}.hero h1,.detail h1,.saved h1{font-size:clamp(48px,5.9vw,94px);line-height:1.08;letter-spacing:-.075em;white-space:pre-line;font-weight:640}.hero p,.detail .copy{margin-top:18px;color:var(--muted);max-width:33ch}.hero-pic{height:clamp(270px,32vw,385px);overflow:hidden}.hero-pic img{height:100%}.cta,.soft{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 21px;border-radius:30px;font-weight:600;text-decoration:none}.cta{background:var(--action);color:var(--on)}.soft{border:1px solid var(--line)}.hero .cta{margin-top:25px}.afterdark .hero{grid-template-columns:1.22fr .95fr;gap:45px}.afterdark .hero-pic{order:-1}.afterdark h1,.afterdark .cards h3,.afterdark .detail h1,.afterdark .saved h1{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-weight:600}.shelf{border-top:1px solid var(--line);padding:25px 0 35px}.shelf-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:0 0 22px}h2{font-size:28px;letter-spacing:-.05em}.filters,.slots{display:flex;gap:8px;flex-wrap:wrap}.filter,.slot{border:1px solid var(--line);border-radius:30px;padding:7px 14px;min-height:44px}.filter[aria-pressed=true],.slot[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{display:block;color:inherit;text-decoration:none;border-top:1px solid var(--line);padding-top:11px}.card img{aspect-ratio:2.65/1}.meta{font:13px/1.6 "Courier New","PingFang SC",monospace;color:var(--muted);margin:10px 0 4px}.cards h3{font-size:clamp(22px,2.4vw,34px);line-height:1.25;letter-spacing:-.05em}.afterdark .card{display:grid;grid-template-columns:105px 1fr;align-items:center;gap:16px}.afterdark .card img{aspect-ratio:1}.afterdark .card .meta{margin-top:0}.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--muted)}.detail{padding:12px 0 36px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4vw;align-items:start;margin-top:8px}.detail-grid>img{aspect-ratio:1}.detail h1{font-size:clamp(38px,4.7vw,67px);margin:14px 0}.detail .copy{max-width:46ch}.facts{display:flex;flex-wrap:wrap;gap:15px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:22px 0}.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:3px 0 0}.slots{margin:12px 0 18px}.detail h2,.saved h2{font-size:21px}.detail .cta:disabled{opacity:.46;cursor:default}.detail .soft{margin-left:8px}.saved{padding:40px 0}.saved h1{font-size:clamp(44px,5vw,64px);margin-bottom:28px}.empty{max-width:45ch;background:var(--tile);padding:28px}.empty p{margin:10px 0 20px}.foot{border-top:1px solid var(--line);padding:15px 0 34px;color:var(--muted);font-size:12px}.foot p+p{margin-top:4px}.bottom{display:none}.toast{position:fixed;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);border-radius:30px;background:var(--ink);color:var(--bg);padding:9px 18px;font-size:14px;white-space:nowrap}.toast:empty{display:none}
@media(max-width:700px){.shell{width:calc(100% - 36px)}.top{min-height:52px}.top nav{display:none}.word{font-size:19px}.top .brand-cn{font-size:12px}.hero,.afterdark .hero{display:flex;flex-direction:column;align-items:stretch;gap:18px;padding:24px 0}.hero h1{font-size:49px;white-space:pre-line}.hero p{font-size:14px;margin-top:10px}.hero .cta{margin-top:14px;min-height:44px}.hero-pic,.afterdark .hero-pic{height:auto;aspect-ratio:1.8;order:0}.afterdark .hero{position:relative;background:var(--tile);gap:0;padding:0;margin:16px 0 22px}.afterdark .hero-pic{order:-1;aspect-ratio:1.75}.afterdark .hero>div:first-child{padding:20px}.afterdark .hero h1{font-size:42px}.shelf{padding-top:16px}.shelf-head{gap:10px;margin-bottom:14px}.shelf-head h2{font-size:23px}.filter{padding:6px 10px;font-size:13px}.cards{gap:16px}.card img{aspect-ratio:1.33}.cards h3{font-size:21px}.meta{font-size:11px}.afterdark .cards{grid-template-columns:1fr}.afterdark .card{grid-template-columns:78px 1fr}.detail-grid{display:block}.detail-grid>img{aspect-ratio:1.68}.detail-grid .meta{margin-top:16px}.detail h1{font-size:38px}.detail .copy{font-size:15px}.saved{padding:26px 0}.foot{padding-bottom:90px}.bottom{position:fixed;z-index:2;display:flex;bottom:0;left:0;right:0;justify-content:center;gap:14px;background:var(--bg);border-top:1px solid var(--line);padding:6px 12px max(6px,env(safe-area-inset-bottom))}.bottom a{padding:8px 23px}.toast{bottom:74px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header class="top"><a class="word" href="#home"><span id="word"></span><span class="brand-cn" id="brand"></span></a><nav aria-label="主导航"></nav></header><main id="main" tabindex="-1"></main><footer class="foot"><p id="prototype"></p><p id="credit"></p></footer></div><nav class="bottom" aria-label="底部导航"></nav><div class="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="brief">{{DATA}}</script><script>
'use strict';
const study=JSON.parse(document.querySelector('#brief').textContent), app=study.app;
const main=document.querySelector('#main'), storeKey='joey-design/app/'+study.id;
const booking=app.mode==='reserve';
let filter='全部', chosen='', previousRoute='', timer;
let saved={};
try { const old=JSON.parse(localStorage.getItem(storeKey)||'{}');
  if(old && typeof old==='object') for(const item of app.items){
    if(booking ? item.slots.includes(old[item.id]) : old[item.id]===true) saved[item.id]=old[item.id];
  }
} catch {}
function element(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function link(txt,href,cls){const el=element('a',cls,txt);el.href=href;return el}
function button(txt,cls,fn){const el=element('button',cls,txt);el.type='button';el.onclick=fn;return el}
function pic(item){const el=element('img');const art=study.images[item.image];el.src=art.src;el.alt=art.alt;return el}
function notice(message){const t=document.querySelector('.toast');t.textContent=message;clearTimeout(timer);timer=setTimeout(()=>t.textContent='',2600)}
function persist(message){try{localStorage.setItem(storeKey,JSON.stringify(saved));notice(message)}catch{notice(message+'（当前窗口有效）')}}
function nav(route){for(const menu of document.querySelectorAll('nav')){menu.replaceChildren();for(const [key,label] of [['home',app.home],['saved',app.saved]]){
  const a=link(label+(key==='saved'&&Object.keys(saved).length?' · '+Object.keys(saved).length:''),'#'+key);
  if(key===(route==='saved'?'saved':'home'))a.setAttribute('aria-current','page');menu.append(a)}}}
function cards(items){const group=element('div','cards');for(const item of items){const a=link('', '#item/'+item.id,'card'), block=element('div');
  const meta=booking && saved[item.id] ? '已选 · '+saved[item.id] : item.meta;block.append(element('p','meta',meta),element('h3','',item.title));a.append(pic(item),block);group.append(a)}
  return group}
function home(){const hero=element('section','hero'), intro=element('div'), art=element('div','hero-pic');
  intro.append(element('h1','',app.title),element('p','',app.subtitle),link(app.feature_action||'查看详情 →','#item/'+app.items[0].id,'cta'));art.append(pic(app.items[0]));hero.append(intro,art);
  const shelf=element('section','shelf'), head=element('div','shelf-head'), filters=element('div','filters');
  for(const name of ['全部',...new Set(app.items.map(i=>i.category))]){const b=button(name,'filter',()=>{filter=name;render(false);Array.from(main.querySelectorAll('.filter')).find(x=>x.textContent===name)?.focus()});b.setAttribute('aria-pressed',String(name===filter));filters.append(b)}
  head.append(element('h2','',app.list),filters);shelf.append(head,cards(app.items.filter(i=>filter==='全部'||i.category===filter)));main.append(hero,shelf)}
function savedView(){const s=element('section','saved');s.append(element('h1','',app.saved));const items=app.items.filter(i=>Object.hasOwn(saved,i.id));
  if(items.length)s.append(cards(items));else{const e=element('div','empty');e.append(element('h2','',app.empty_title||'暂无记录'),element('p','',app.empty_body||('打开'+app.home+'，选择一项并完成「'+app.action+'」')),link('回到'+app.home,'#home','cta'));s.append(e)}main.append(s)}
function detail(item){const section=element('section','detail'), grid=element('div','detail-grid'), content=element('div');
  section.append(link('← '+(previousRoute==='saved'?app.saved:app.home),previousRoute==='saved'?'#saved':'#home','back'));content.append(element('p','meta',app.detail+'  /  '+item.meta),element('h1','',item.title),element('p','copy',item.body));
  const facts=element('dl','facts');for(const [k,v] of item.facts){const g=element('div');g.append(element('dt','',k),element('dd','',v));facts.append(g)}content.append(facts);
  if(booking){content.append(element('h2','',app.action));const slots=element('div','slots');for(const s of item.slots){const b=button(s,'slot',()=>{chosen=s;render(false);Array.from(main.querySelectorAll('.slot')).find(x=>x.textContent===s)?.focus()});b.setAttribute('aria-pressed',String((chosen||saved[item.id])===s));slots.append(b)}content.append(slots);
    const confirm=button(saved[item.id]?'更新场次':'确认本地预约','cta',()=>{saved[item.id]=chosen||saved[item.id];persist('已记录 '+saved[item.id]);location.hash='saved'});confirm.disabled=!chosen||chosen===saved[item.id];content.append(confirm);
    if(saved[item.id])content.append(button(app.undo,'soft',()=>{delete saved[item.id];chosen='';persist('已取消');location.hash='saved'}));
  }else{const current=!!saved[item.id];const b=button(current?app.undo:app.action,'cta',()=>{if(current)delete saved[item.id];else saved[item.id]=true;persist(current?'已移出收藏':'已加入收藏');render(false);main.querySelector('.detail .cta').focus()});b.setAttribute('aria-pressed',String(current));content.append(b)}
  grid.append(pic(item),content);section.append(grid);main.append(section)}
let lastRoute='';
function render(navigated=true){let route=location.hash.slice(1)||'home';if(navigated && route!==lastRoute){if(!lastRoute.startsWith('item/'))previousRoute=lastRoute;chosen='';lastRoute=route}
  main.replaceChildren();nav(route);if(route==='saved')savedView();else if(route.startsWith('item/') && app.items.some(i=>'item/'+i.id===route))detail(app.items.find(i=>'item/'+i.id===route));else home();
  if(navigated){window.scrollTo(0,0);main.focus({preventScroll:true})}}
document.body.className=study.theme;document.querySelector('#word').textContent=study.imprint;document.querySelector('#brand').textContent=study.brand;document.querySelector('#credit').textContent=study.credit;document.querySelector('#prototype').textContent=booking?'预约记录存在当前浏览器':'收藏存在当前浏览器';window.addEventListener('hashchange',()=>render());render();
</script></body></html>
