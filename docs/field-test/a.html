<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周六报名 · 社区修理铺</title>
<style>
:root{color-scheme:light;--ink:#182849;--blue:#233f96;--blue-deep:#182f79;--paper:#fbf9f1;--rule:#c7c6b8;--muted:#565d66;--orange:#ec8149;--mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55}button,input{font:inherit}button,label{touch-action:manipulation}svg{display:block}.glyphs{position:absolute;width:0;height:0;overflow:hidden}.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.shell{max-width:1224px;padding:0 44px;margin:auto}.masthead{display:flex;align-items:center;justify-content:space-between;min-height:73px;border-bottom:2px solid var(--ink)}.identity,.demo,.legend,.heading,.card-name,.item-title,.fields,.choice,.cta,.confirmed-head,.availability{display:flex;align-items:center}.identity{gap:10px;font-size:22px;font-weight:850;letter-spacing:.07em}.mark{width:35px;height:35px}.demo{gap:7px;font-size:13px;font-weight:650}.demo:before{content:"";width:8px;height:8px;background:var(--orange);border:1px solid var(--ink);border-radius:50%}
.hero{position:relative;display:grid;grid-template-columns:1.04fr 1fr;align-items:center;min-height:253px;margin:20px 0 32px;background:#efeadd;border:1.5px solid var(--ink);overflow:hidden;isolation:isolate}.hero:before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#b7ac9652 .65px,transparent .75px);background-size:4px 4px}.hero-copy{padding:22px 0 22px 40px;z-index:1}.hero h1{font-size:clamp(44px,4.7vw,69px);letter-spacing:-.075em;line-height:1.1;margin:0 0 14px;font-weight:900;color:var(--blue-deep)}.hero h1 span{display:block}.hero p{margin:0;font-size:15px;font-weight:550}.hero-art{align-self:stretch;position:relative;overflow:hidden}.hero-art svg{position:absolute;height:100%;width:100%;inset:0}.workbench{display:grid;grid-template-columns:minmax(0,1.87fr) minmax(295px,1fr);gap:28px;align-items:start}.heading{justify-content:space-between;gap:4px;margin-bottom:15px}h2{font-size:23px;line-height:1.3;letter-spacing:-.055em;margin:0;font-weight:850}.legend{gap:11px;color:var(--muted);font-size:12px}.key{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.key:before{content:"";width:9px;height:9px;border-radius:1px;background:var(--blue)}.key.used:before,.unit.used{background:repeating-linear-gradient(135deg,#d5d3c8 0 2px,#f2efe6 2px 4px)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.session{background:#fffdf6;border:1px solid var(--rule);min-width:0}.session-head{padding:16px 20px 14px;border-bottom:1px solid var(--rule);background:#f4efdf}.session:nth-child(2) .session-head{background:#e7edf0}.card-name{gap:9px}.card-name .icon{width:24px;height:24px}.card-name h3{font-size:21px;margin:0;font-weight:850;letter-spacing:-.045em}.time{display:block;margin-top:4px;font:600 15px/1.4 var(--mono);letter-spacing:.025em}.session-body{padding:0 20px}.item{padding:16px 0 15px}.item+.item{border-top:1px dashed var(--rule)}.line{display:flex;align-items:center;justify-content:space-between;gap:4px}.item-title{gap:6px;font-size:15px;font-weight:700}.item-title .icon{width:18px;height:18px}.availability{color:var(--blue);gap:3px;font-size:12px;white-space:nowrap;font-weight:650}.availability strong{font:750 23px/1 var(--mono)}.availability.full{font-size:13px;color:#595950}.scale{height:9px;display:flex;gap:3px;margin:9px 0 5px;width:100%}.unit{flex:0 1 calc((100% - 33px)/12);background:var(--blue);border-radius:1px}.counts{display:block;color:var(--muted);font-size:12px}.ticket{position:relative;background:#fcf9eb;border:1.5px solid var(--ink);box-shadow:3px 3px 0 #d4d0c1}.ticket-top{display:flex;align-items:center;justify-content:space-between;padding:12px 19px;background:var(--blue);color:#fffdf6}.ticket-top h2{font-size:20px}.ticket-top .icon{width:23px;height:23px}.ticket-body{padding:13px 19px 12px}.fields{gap:9px 12px;margin:0 0 9px;padding:0;border:0;min-inline-size:0}.field-label{font-size:13px;font-weight:700;white-space:nowrap}.pair{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{position:relative;justify-content:center;border:1px solid #afae9f;background:#fffdf7;min-height:44px;color:var(--ink);font-size:14px;font-weight:650;cursor:pointer;transition:background .15s,border-color .15s;gap:6px}.choice:before{content:"";width:11px;height:11px;border:1px solid #777c80;border-radius:50%}.choice:has(input:checked){border-color:var(--blue);background:#e8edf9;color:var(--blue-deep)}.choice:has(input:checked):before{border:3.5px solid var(--blue);background:white}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice:has(input:focus-visible),button:focus-visible{outline:3px solid #b44f17;outline-offset:2px}.choice:hover{background:#f2f1e6}.ticket-action{border-top:1px dashed #a9a797;padding-top:10px;margin-top:3px}.selected{font-size:13px;margin:0 0 7px;font-weight:600}.cta{width:100%;justify-content:space-between;border:1px solid var(--blue);background:var(--blue);color:#fff;min-height:44px;padding:7px 12px;font-weight:700;cursor:pointer;transition:background .15s}.cta:hover{background:var(--blue-deep)}.cta:disabled{background:#e6e4da;border-color:#c7c6bf;color:#5e5e55;cursor:not-allowed}.cta .icon{width:18px;height:18px}.note{font-size:12px;color:var(--muted);margin:9px 0 0}.confirmed-head{gap:10px;margin:8px 0 12px;color:var(--blue)}.confirmed-head h3{margin:0;font-size:23px}.receipt p{margin:3px 0}.receipt .time{margin-bottom:18px}.receipt .cta{margin-top:16px;justify-content:center;background:#fffdf7;color:var(--blue)}.receipt .cta:hover{background:#e8edf9}.footer{border-top:1px solid var(--rule);margin:25px 0 18px;padding-top:10px;color:var(--muted);font-size:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.warning{color:#853700;font-size:13px;margin:8px 0}.warning:empty{display:none}[hidden]{display:none!important}
@media(min-width:1450px){.hero{min-height:285px}.hero-copy{padding-left:54px}}
@media(max-width:960px){.shell{padding:0 24px}.workbench{grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:15px}.session-head{padding:14px}.session-body{padding:0 14px}.ticket-body{padding:13px}.hero-copy{padding-left:27px}.legend{gap:7px}.hero{min-height:222px}}
@media(max-width:740px){.shell{padding:0 17px}.masthead{min-height:58px}.identity{font-size:19px;gap:7px}.mark{width:30px;height:30px}.demo{font-size:12px}.hero{margin:14px 0 23px;min-height:190px;grid-template-columns:1.14fr 1fr}.hero h1{font-size:clamp(35px,6.7vw,47px);margin-bottom:9px}.hero-copy{padding:16px 0 16px 17px}.hero p{font-size:14px;line-height:1.55;max-width:17em}.hero-art svg{width:132%;left:-17%}.workbench{grid-template-columns:1fr;gap:20px}.heading{margin-bottom:10px}.heading h2{font-size:21px}.legend{font-size:11px;gap:8px}.cards{gap:8px}.session-head{padding:11px 12px 10px}.card-name{gap:6px}.card-name h3{font-size:19px}.card-name .icon{width:20px;height:20px}.time{font-size:13px}.session-body{padding:0 12px}.item{padding:11px 0}.item-title{font-size:14px;gap:4px}.item-title .icon{width:16px;height:16px}.availability strong{font-size:19px}.availability{gap:1px}.counts{font-size:11px}.scale{gap:2px;margin:7px 0 3px;height:7px}.unit{flex-basis:calc((100% - 22px)/12)}.ticket-top{padding:11px 14px}.ticket-body{padding:13px 14px}.footer{margin-top:18px}.ticket{box-shadow:2px 2px 0 #d4d0c1}}
@media(max-width:430px){.hero-art svg{height:90%;top:3%;width:158%;left:-26%}.hero{min-height:175px}.hero-copy{padding-left:13px}.hero h1{font-size:37px}.hero p{max-width:13em;font-size:13px}.fields{margin-bottom:8px}.hero-art{margin-left:-7px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg class="glyphs" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1"/></symbol>
<symbol id="afternoon" viewBox="0 0 24 24"><path d="M2 16h20M4 20h16M6.5 15.5a5.5 5.5 0 0 1 11 0M12 4v3M3.5 8l2.1 2.1M20.5 8l-2.1 2.1"/></symbol>
<symbol id="plug" viewBox="0 0 24 24"><path d="M9 3v5m6-5v5M6 8h12v2.5a6 6 0 0 1-12 0zm6 8v2c0 2-1.3 3-4 3"/></symbol>
<symbol id="shirt" viewBox="0 0 24 24"><path d="m8 4-5 3-1 4 4 2 1-2v10h10V11l1 2 4-2-1-4-5-3c-.8 1.3-2 2-4 2s-3.2-.7-4-2Z"/></symbol>
<symbol id="ticket" viewBox="0 0 24 24"><path d="M3 5h18v4c-3 .1-3 5.9 0 6v4H3v-4c3-.1 3-5.9 0-6zM15 7v2m0 2v2m0 2v2"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-7"/></symbol>
</defs></svg>
<div class="shell">
<header class="masthead"><div class="identity"><svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><path fill="#233f96" d="m11 2 21 0 10 18-10 21H11L1 23Z"/><path fill="#fff9e5" d="M29 9a8 8 0 0 0-10.1 9.7L9.7 28a3.8 3.8 0 0 0 5.4 5.4l9.2-9.3A8 8 0 0 0 34 14l-6.1 5.5-4-3.9Z"/><circle cx="12.6" cy="30.6" r="1.25" fill="#233f96"/></svg>社区修理铺</div><span class="demo">本机演示</span></header>
<main><section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><h1 id="hero-title"><span>周六，</span>来修一修。</h1><p id="summary">修电器，下午余 6 位。修衣物，上午余 5 位，下午已满。</p></div>
<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 520 255" preserveAspectRatio="xMidYMid meet"><defs>
<pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".85" fill="#263f7e"/></pattern><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v5" stroke="#253976" stroke-width="1.5"/></pattern>
<path id="blade" d="M-4 0C-40-15-43-49-20-65c12-8 37-9 52-1 6 3 7 7 1 11C7-39 2-23 5-3z"/><path id="wire" d="M-6-14Q-28-37-25-76"/>
</defs>
<g fill="none" stroke="#908a77" stroke-width=".8"><path d="M40 223h414m-370 5 18-10m338 10 18-10M130 59h13m-6.5-6.5v13M415 140h12m-6-6v12"/></g>
<circle cx="280" cy="122" r="103" fill="#ed945f"/><circle cx="300" cy="125" r="103" fill="url(#dots)" opacity=".37"/>
<ellipse cx="282" cy="227" rx="106" ry="7" fill="url(#hatch)" opacity=".6"/>
<g fill="none" stroke="#203578" stroke-linecap="round" stroke-linejoin="round"><path d="M254 213c-31-3-61 3-82 12-20 8-45 12-54 6-10-7 6-14 12-10 7 5-12 11-28 5l-16-7" stroke-width="3.5"/><g transform="rotate(19 83 216)"><rect x="70" y="209" width="19" height="12" rx="2.7" fill="#283e84" stroke-width="2"/><path d="M62 211h8m-8 6h8" stroke-width="3"/></g></g>
<g stroke="#1e3273" stroke-width="3" stroke-linejoin="round"><path d="m250 144-3 43-14 12c-3 3-5 8-4 12l14 4 54-9-18-12-2-37Z" fill="#394f99"/><path d="m263 154-2 37-10 11 33-3-8-6-3-38Z" fill="#8e9cbd"/><path d="m224 204 52-9c11-2 25 1 33 6l18 12-78 13-40-9c0-6 6-12 15-13Z" fill="#d1d2c3"/><path d="m209 217 40 8 78-13v7l-79 13-40-9Z" fill="#253a80"/><path d="m225 206 34 7 49-8" fill="none" stroke-width="1.5"/><path d="m266 203 9-1 4 2-9 2Z" fill="#d7763e" stroke-width="1.3"/></g>
<g transform="translate(270 104) rotate(-10) scale(1 .96)">
<ellipse cx="-14" cy="4" rx="88" ry="87" fill="#23397c" stroke="#1c2f67" stroke-width="4"/><ellipse cx="-10" cy="2" rx="85" ry="84" fill="url(#hatch)" stroke="#f0e6c8" stroke-width="2"/>
<circle r="85" fill="#e5ddc0" stroke="#263b81" stroke-width="4"/><circle r="79" fill="url(#dots)" opacity=".42"/>
<g fill="#627eaa" stroke="#253777" stroke-width="3.2"><use href="#blade"/><use href="#blade" transform="rotate(120)"/><use href="#blade" transform="rotate(240)"/></g>
<g fill="none" stroke="#2c4687"><circle r="78" stroke-width="3.5"/><circle r="65" stroke-width="1.4"/><circle r="48" stroke-width="1.5"/><circle r="30" stroke-width="1.5"/><g stroke-width="1.85">
<use href="#wire"/><use href="#wire" transform="rotate(22.5)"/><use href="#wire" transform="rotate(45)"/><use href="#wire" transform="rotate(67.5)"/><use href="#wire" transform="rotate(90)"/><use href="#wire" transform="rotate(112.5)"/><use href="#wire" transform="rotate(135)"/><use href="#wire" transform="rotate(157.5)"/><use href="#wire" transform="rotate(180)"/><use href="#wire" transform="rotate(202.5)"/><use href="#wire" transform="rotate(225)"/><use href="#wire" transform="rotate(247.5)"/><use href="#wire" transform="rotate(270)"/><use href="#wire" transform="rotate(292.5)"/><use href="#wire" transform="rotate(315)"/><use href="#wire" transform="rotate(337.5)"/></g></g>
<circle r="16" fill="#f5d59e" stroke="#223976" stroke-width="3.4"/><circle r="10" fill="#e49764" stroke="#394c84" stroke-width="1.4"/><path d="m-5 3 9-7m-5 8 6-4" stroke="#283f82" stroke-width="1.5"/></g>
<g fill="none" stroke="#233b7a" stroke-width="1.5"><path d="m352 48 20-13h26m-146 136-35 10h-30"/><circle cx="400" cy="35" r="2.8"/><circle cx="184" cy="181" r="2.8"/></g>
</svg></div></section>
<div class="workbench"><section aria-labelledby="board-title"><div class="heading"><h2 id="board-title">场次与名额</h2><div class="legend" aria-label="名额图例"><span class="key">可留</span><span class="key used">已约</span></div></div><div class="cards" id="cards"></div></section>
<section class="ticket" aria-labelledby="ticket-title"><div class="ticket-top"><h2 id="ticket-title">给自己留一位</h2><svg class="icon" aria-hidden="true"><use href="#ticket"/></svg></div><div class="ticket-body">
<form id="form"><div class="fields" role="radiogroup" aria-labelledby="field-session"><span class="field-label" id="field-session">场次</span><div class="pair"><label class="choice"><input type="radio" name="session" value="am" checked>上午</label><label class="choice"><input type="radio" name="session" value="pm">下午</label></div></div>
<div class="fields" role="radiogroup" aria-labelledby="field-project"><span class="field-label" id="field-project">项目</span><div class="pair"><label class="choice"><input type="radio" name="project" value="appliance" checked>电器</label><label class="choice"><input type="radio" name="project" value="clothes">衣物</label></div></div>
<div class="ticket-action"><p class="selected" id="selected" aria-live="polite"></p><button class="cta" id="reserve" type="submit"><span id="action-label">确认留位</span><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button></div></form>
<div class="receipt" id="receipt" hidden><div class="confirmed-head"><svg class="icon" aria-hidden="true"><use href="#tick"/></svg><h3>已为你留位</h3></div><p id="receipt-choice"></p><p class="time" id="receipt-time"></p><button class="cta" type="button" id="cancel">撤销留位</button></div>
<p class="note">留位后可随时撤销。</p><p class="warning" id="warning" role="alert"></p></div></section></div>
</main><footer class="footer">报名演示 · 留位记录仅保存在当前浏览器。</footer><div class="sr" role="status" id="status"></div></div>
<script>
(() => {
  'use strict';
  const times = {
    am: {name:'上午', time:'09:00–12:00', icon:'sun', appliance:[12,10], clothes:[8,3]},
    pm: {name:'下午', time:'14:00–17:00', icon:'afternoon', appliance:[10,4], clothes:[6,6]}
  };
  const projects = {appliance:'电器',clothes:'衣物'};
  const key = 'neighborhood-workshop.saturday.place.v1';
  const get = id => document.getElementById(id);
  const form = get('form');
  let hold = null;
  function readHold() {
    const value = JSON.parse(localStorage.getItem(key) || 'null');
    if (!value || !Object.hasOwn(times,value.session) || !Object.hasOwn(projects,value.project)) return null;
    const [total,booked] = times[value.session][value.project];
    return total > booked ? {session:value.session,project:value.project} : null;
  }
  function sync() {
    try { hold = readHold(); }
    catch (error) {
      if (error instanceof SyntaxError) hold = null;
      else get('warning').textContent = '当前浏览器无法读取本机记录，请检查存储权限。';
    }
  }
  function booked(session,project) {
    return times[session][project][1] + Number(hold?.session === session && hold?.project === project);
  }
  function left(session,project) { return times[session][project][0] - booked(session,project); }
  function icon(id) { return '<svg class="icon" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
  function item(session,project) {
    const total = times[session][project][0];
    const count = booked(session,project);
    const remaining = total-count;
    const units = Array.from({length:total},(_,i) => '<span class="unit'+(i < remaining ? '' : ' used')+'"></span>').join('');
    const status = remaining ? '余 <strong>'+remaining+'</strong> 位' : '已满';
    return '<div class="item"><div class="line"><span class="item-title">'+icon(project==='appliance'?'plug':'shirt')+projects[project]+'</span><span class="availability'+(remaining?'':' full')+'">'+status+'</span></div><div class="scale" aria-hidden="true">'+units+'</div><span class="counts">已约 '+count+' / 共 '+total+' 位</span></div>';
  }
  function drawChoice() {
    const session = form.elements.session.value;
    const project = form.elements.project.value;
    const remaining = left(session,project);
    get('selected').textContent = times[session].name+' · '+projects[project]+'　'+(remaining?'剩余 '+remaining+' 位':'已满，换个场次或项目');
    get('reserve').disabled = !remaining;
    get('action-label').textContent = remaining ? '确认留位' : '名额已满';
  }
  function render() {
    get('cards').innerHTML = Object.entries(times).map(([session,data]) =>
      '<article class="session"><div class="session-head"><div class="card-name">'+icon(data.icon)+'<h3>'+data.name+'场</h3></div><span class="time">'+data.time+'</span></div><div class="session-body">'+Object.keys(projects).map(project=>item(session,project)).join('')+'</div></article>'
    ).join('');
    get('summary').textContent='修电器，下午余 '+left('pm','appliance')+' 位。修衣物，上午余 '+left('am','clothes')+' 位，下午已满。';
    form.hidden = !!hold;
    get('receipt').hidden = !hold;
    if (hold) {
      form.elements.session.value = hold.session;
      form.elements.project.value = hold.project;
      get('receipt-choice').textContent = '周六'+times[hold.session].name+'场 · '+projects[hold.project]+' · 1 位';
      get('receipt-time').textContent = times[hold.session].time;
    }
    drawChoice();
  }
  function save(next) {
    try {
      if (next) localStorage.setItem(key,JSON.stringify(next));
      else localStorage.removeItem(key);
    } catch {
      get('warning').textContent = '无法保存变更，请允许浏览器使用本机存储后重试。';
      return false;
    }
    get('warning').textContent = '';
    hold = next;
    return true;
  }
  form.addEventListener('change',drawChoice);
  form.addEventListener('submit',event=>{
    event.preventDefault();
    sync();
    const session=form.elements.session.value, project=form.elements.project.value;
    if (hold || !left(session,project)) {render();return;}
    if (!save({session,project})) return;
    render();
    get('status').textContent='已为你保留周六'+times[session].name+projects[project]+'名额一位。';
    get('cancel').focus();
  });
  get('cancel').addEventListener('click',()=>{
    if (!save(null)) return;
    render();
    get('status').textContent='留位已撤销，名额已恢复。';
    get('reserve').focus();
  });
  window.addEventListener('storage',event=>{ if (event.key===key || event.key===null) {sync();render();} });
  sync();render();
})();
</script>
</body></html>
