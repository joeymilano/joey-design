const D=JSON.parse(document.getElementById('brief').textContent),g=id=>document.getElementById(id),items=D.items
const labels={all:'全部',keep:'入选',reject:'淘汰',new:'待选'},key='joey/proof/'+D.id
let filter='all',active=items[0].id,marks={},history=[]
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object')for(const i of items)if(['keep','reject'].includes(saved[i.id]))marks[i.id]=saved[i.id]}catch{}
const subset=()=>items.filter(i=>filter==='all'||(marks[i.id]||'new')===filter)
const button=(text,act)=>{const b=document.createElement('button');b.textContent=text;b.onclick=act;return b}
function save(){try{localStorage.setItem(key,JSON.stringify(marks))}catch{}}
function render(){
 const group=subset()
 if(!group.some(i=>i.id===active))active=group[0]?.id
 const i=group.find(i=>i.id===active),index=group.indexOf(i)
 g('workspace').hidden=!i;g('empty').hidden=!!i;g('emptytitle').textContent='这里还没有'+labels[filter]+'底片'
 for(const b of g('filters').children)b.setAttribute('aria-pressed',b.dataset.filter===filter)
 const kept=items.filter(i=>marks[i.id]==='keep').length
 g('total').textContent=items.length+' 张底片 / '+kept+' 张入选';g('export').disabled=!kept;g('undo').disabled=!history.length
 if(!i)return
 g('frame').src=D.art[i.image];g('frame').alt=i.alt;g('shot').textContent=i.title;g('series').textContent=i.series+' / '+labels[marks[i.id]||'new'];g('note').textContent=i.note
 g('pick').setAttribute('aria-pressed',marks[i.id]==='keep');g('reject').setAttribute('aria-pressed',marks[i.id]==='reject')
 g('ord').textContent=(index+1)+' / '+group.length;g('prev').disabled=index===0;g('next').disabled=index===group.length-1
 g('film').replaceChildren(...group.map(item=>{
  const b=button('',()=>{active=item.id;render();g('film').querySelector('[aria-pressed="true"]')?.focus({preventScroll:true})});b.setAttribute('aria-label',item.title);b.setAttribute('aria-pressed',item.id===active)
  const image=new Image();image.src=D.art[item.image];image.alt='';const s=document.createElement('small');s.textContent=item.title;b.append(image,s)
  if(marks[item.id]){const flag=document.createElement('b');flag.textContent=labels[marks[item.id]];b.append(flag)}return b
 }))
}
function setMark(m){
 const i=items.find(i=>i.id===active);if(!i)return
 history.push([i.id,marks[i.id],filter]);if(history.length>100)history.shift()
 if(marks[i.id]===m)delete marks[i.id];else marks[i.id]=m
 save();g('notice').textContent=i.title+' · '+labels[marks[i.id]||'new'];render()
}
function undo(){const a=history.pop();if(!a)return;const [id,old,f]=a;if(old)marks[id]=old;else delete marks[id];active=id;filter=f;save();render();g('notice').textContent='已撤销上次标记'}
function go(dx){const list=subset(),pos=list.findIndex(i=>i.id===active);if(list[pos+dx]){active=list[pos+dx].id;render()}}
for(const [v,t] of Object.entries(labels)){const b=button(t,()=>{filter=v;render()});b.dataset.filter=v;g('filters').append(b)}
g('all').onclick=()=>{filter='all';render()};g('prev').onclick=()=>go(-1);g('next').onclick=()=>go(1)
g('pick').onclick=()=>setMark('keep');g('reject').onclick=()=>setMark('reject');g('undo').onclick=undo
g('export').onclick=()=>{const l=items.filter(i=>marks[i.id]==='keep').map(i=>({id:i.id,title:i.title,filename:i.image,series:i.series}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(l,null,2)],{type:'application/json'}));a.download=D.id+'-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey||e.repeat)return;const act={ArrowLeft:()=>go(-1),ArrowRight:()=>go(1),p:()=>setMark('keep'),x:()=>setMark('reject'),z:undo}[e.key]||null;if(act){e.preventDefault();act()}})
for(const [id,k] of [['brand','title'],['mast','mast'],['title','intro'],['credit','credit']])g(id).textContent=D[k]
render()
</script></html>
