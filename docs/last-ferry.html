const D=JSON.parse(document.getElementById('brief').textContent), el=id=>document.getElementById(id)
const moves={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}
const storageKey='joey/ferry/'+D.id+'/'+JSON.stringify(D.levels.map(l=>[l.map,l.budget]))
let records={}
try{const stored=JSON.parse(localStorage.getItem(storageKey));if(stored && typeof stored==='object')records=stored}catch{}
let idx=0,state='menu',x=0,y=0,steps=0,route=[],visited=new Set()
const lvl=()=>D.levels[idx]
function nextIndex(){const n=D.levels.findIndex((_,i)=>!Number.isInteger(records[i]));return n===-1?0:n}
function historyList(){
  el('records').replaceChildren(...D.levels.map((l,i)=>{const li=document.createElement('li');li.textContent=l.name+' · '+(Number.isInteger(records[i])?records[i]+' 步':'尚未抵达');return li}))
  el('continue').hidden=nextIndex()===0
}
function begin(i){
  idx=i;const l=lvl()
  y=l.map.findIndex(row=>row.includes('S'));x=l.map[y].indexOf('S')
  steps=0;visited=new Set();route=[[x,y]];state='sailing'
  el('menu').hidden=true;el('play').hidden=false;el('next').hidden=true
  el('level').textContent=l.name;el('result').textContent='航班日志';el('log').textContent='离港，先去亮着琥珀灯的站点'
  draw();el('retry').focus({preventScroll:true})
}
function color(ctx,c){ctx.fillStyle=c}
function dock(ctx,gx,gy,terrain,seen,boat){
  const a=gx*24,b=gy*24
  function rect(c,x,y,w,h){color(ctx,c);ctx.fillRect(a+x,b+y,w,h)}
  rect((gx+gy)%2?'#123844':'#133d49',0,0,24,24)
  for(let k=0;k<3;k++){const px=(gx*13+gy*7+k*9)%20,py=(gx*3+gy*11+k*7)%21;rect('#21505a',px,py,3+(k%2),1)}
  rect('#1c4851',0,23,24,1);rect('#1c4851',23,0,1,24)
  if(terrain==='#'){
    rect('#071e2b',0,4,23,20);rect('#455657',1,1,21,17);rect('#718176',1,1,21,2)
    rect('#33494f',3,4,17,11);rect('#80938a',4,5,15,2)
    for(let i=0;i<3;i++){rect('#536764',4+i*5,8,3,5);rect('#b7a073',3+i*7,17,3,2)}
  }
  if(terrain==='B'){
    rect('#202d31',4,14,15,5);rect('#9d7850',5,13,14,2)
    rect(seen?'#5d9b8b':'#e89b42',9,4,5,9);rect(seen?'#8ac6ad':'#ffdf8c',10,4,3,3)
    rect('#1c333a',10,10,3,2)
  }
  if(terrain==='E'){
    rect('#809c8d',2,3,3,18);rect('#809c8d',19,3,3,18);rect('#c2cfaa',2,2,20,3)
    rect('#35ae9c',6,5,12,3);rect('#c5ebce',11,10,2,7);rect('#c5ebce',9,14,6,2)
  }
  if(boat){
    rect('#071e2b',2,17,19,3);rect('#df8d3a',3,14,18,3);rect('#f6d99b',2,12,19,2)
    rect('#c8873b',7,8,10,4);rect('#ffe291',8,7,9,2);rect('#273941',9,9,2,2);rect('#344b50',13,9,2,2)
    rect('#e9bc70',14,4,1,4);rect('#76bdb8',1,19,8,1)
  }
}
function draw(){
  const rows=lvl().map,c=el('map');c.width=rows[0].length*24;c.height=rows.length*24
  const ctx=c.getContext('2d')
  for(let yy=0;yy<rows.length;yy++) for(let xx=0;xx<rows[yy].length;xx++)dock(ctx,xx,yy,rows[yy][xx],visited.has(xx+','+yy),false)
  for(const [xx,yy] of route.slice(0,-1)){color(ctx,'#639a92');ctx.fillRect(xx*24+11,yy*24+19,2,1)}
  dock(ctx,x,y,rows[y][x],visited.has(x+','+y),true)
  const total=rows.join('').split('B').length-1
  el('fuel').textContent=String(lvl().budget-steps);el('picked').textContent=visited.size+' / '+total
  el('map').setAttribute('aria-label',lvl().name+'，船在第 '+(y+1)+' 行第 '+(x+1)+' 列')
  const names={'.':'水','#':'栈桥','B':'候船点','E':'终点','S':'出发点'}
  el('maptext').textContent=rows.map((r,yy)=>'第 '+(yy+1)+' 行 '+[...r].map((char,xx)=>x===xx&&y===yy?'船':visited.has(xx+','+yy)?'已接站点':names[char]).join('，')).join(' / ')
  document.querySelectorAll('[data-key]').forEach(b=>b.disabled=state!=='sailing')
}
function sail(key){
  if(state!=='sailing'||!moves[key])return
  const [dx,dy]=moves[key],xx=x+dx,yy=y+dy,cell=lvl().map[yy]?.[xx]
  if(!cell||cell==='#'){el('log').textContent='前面走不通，换个方向';return}
  x=xx;y=yy;steps++;route.push([x,y])
  const coord=x+','+y
  let message='船在第 '+(y+1)+' 行，第 '+(x+1)+' 列'
  if(cell==='B'&&!visited.has(coord)){visited.add(coord);message='乘客上船，本站的灯灭了'}
  const all=visited.size===lvl().map.join('').split('B').length-1
  if(cell==='E' && all){
    state='won';records[idx]=Math.min(records[idx]||Infinity,steps)
    try{localStorage.setItem(storageKey,JSON.stringify(records))}catch{}
    el('result').textContent=idx===D.levels.length-1?'末班船到港':'顺利靠岸'
    const last=idx===D.levels.length-1
    message='全员到齐，本段用了 '+steps+' 步'
    el('next').textContent=last?'再跑一轮':'下一段航线';el('next').hidden=false;historyList()
  }else if(steps===lvl().budget){state='lost';el('result').textContent='航程用尽';message='还没接齐抵达终点，重开这段试试另一条路'}
  else if(cell==='E')message='还有乘客在等船，接齐后再回来'
  el('log').textContent=message;draw()
  if(state==='won')el('next').focus({preventScroll:true})
  if(state==='lost')el('retry').focus({preventScroll:true})
}
for(const id of ['title','intro','mast','credit'])el(id).textContent=D[id]
el('brand').textContent=D.mast;el('keyart').src=D.art[D.image];el('keyart').alt=D.alt
el('start').onclick=()=>begin(0);el('continue').onclick=()=>begin(nextIndex());el('retry').onclick=()=>begin(idx);el('next').onclick=()=>begin((idx+1)%D.levels.length)
el('home').onclick=()=>{state='menu';el('play').hidden=true;el('menu').hidden=false;el('start').focus()}
for(const b of document.querySelectorAll('[data-key]'))b.onclick=()=>sail(b.dataset.key)
document.addEventListener('keydown',e=>{if(state==='sailing'&&moves[e.key]&&!e.altKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();if(!e.repeat)sail(e.key)}})
historyList()
</script></html>
