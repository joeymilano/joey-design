<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Night School</title><style>*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.55 Inter,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif}main{max-width:1420px;margin:auto;padding:0 clamp(18px,4vw,72px)}.mast,footer,.bar,.toolbar,.summary,.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.mast{padding:20px 0;border-bottom:1px solid var(--rule);font-size:.83rem}.mast span:first-child{font-weight:700}footer{font-size:.8rem;padding:23px 0 36px;border-top:1px solid var(--rule);margin-top:36px}h1,h2,h3,p,figure{margin:0}h1{letter-spacing:-.065em;line-height:.98;text-wrap:balance;overflow-wrap:anywhere}h2{line-height:1.15;font-size:clamp(24px,3.6vw,48px);letter-spacing:-.045em}button,select{font:inherit;color:inherit}button,select{min-height:44px;padding:8px 14px;border:1px solid var(--rule);background:transparent;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true],button.solid{color:var(--paper);background:var(--ink);border-color:var(--ink)}.hero{display:grid;position:relative}.hero-copy p{max-width:36ch;margin-top:22px}.toolbar{margin:22px 0}.controls{justify-content:flex-start;gap:6px}.bar{border-bottom:1px solid var(--rule);padding:17px 0}.meta,figcaption{font-size:.83rem}.status{min-height:1.55em;margin-top:10px}.row{border-bottom:1px solid var(--rule);padding:19px 0}.row p{margin-top:4px}.row h3{font-size:1.3rem}.summary{margin:20px 0 0}.mono,time,.num{font-variant-numeric:tabular-nums}.num{font-family:"SFMono-Regular",Consolas,monospace}
.samples{--paper:#f3f0e5;--ink:#283827;--rule:#8d9986;--focus:#7d421a}.samples .mast span:first-child{font:600 clamp(22px,2.4vw,36px)/1 Georgia,serif;letter-spacing:-.055em}.samples .hero{grid-template-columns:.84fr 1.16fr;align-items:center;padding:26px 0;gap:5%}.samples h1{font:normal clamp(64px,8.9vw,145px)/.84 Georgia,"Times New Roman",serif;letter-spacing:-.085em;max-width:8ch}.samples .hero-copy p{max-width:33ch}.samples #cover img{width:100%;display:block;aspect-ratio:1.6;object-fit:cover}.samples .row{display:grid;grid-template-columns:52px 1fr 1.7fr auto;align-items:center;gap:20px}.swatch{width:51px;height:61px;background:var(--swatch);position:relative}.swatch:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(102deg,transparent 0 2px,#ffffff26 2px 3px)}.samples .row h3{font:normal clamp(22px,2.3vw,36px)/1.05 Georgia,serif}.samples .sample-info{font-size:.88rem}.qty{min-width:2ch;text-align:center}
.report{--paper:#fffae9;--ink:#202921;--rule:#929485;--focus:#075c70}.report .mast{font-family:Georgia,"Songti SC",serif}.report .mast span:first-child{font-size:clamp(24px,3vw,43px);font-style:italic;line-height:1}.report .hero{background:#f1b924;padding:clamp(24px,4.2vw,66px);margin:18px 0 24px;grid-template-columns:1.2fr 1fr;align-items:end;gap:5%}.report .hero h1{font:750 clamp(45px,5.6vw,85px)/1.06 "Songti SC","Noto Serif CJK SC",Georgia,serif;letter-spacing:-.045em}.big{display:block;font:600 clamp(70px,8.4vw,139px)/.92 Inter,Arial,sans-serif;letter-spacing:-.085em}.compare{display:grid;gap:15px;margin:24px 0}.series{display:grid;grid-template-columns:minmax(82px,14%) 1fr;gap:15px;align-items:center}.bars{display:grid;gap:5px}.barline{display:grid;grid-template-columns:1fr 55px;gap:10px;align-items:center}.track{background:#eae6d8;height:12px}.length{display:block;background:#1b5953;height:100%}.previous .length{background:#aab5a2}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:.85rem}.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;background:#1b5953}.legend span:first-child i{background:#aab5a2}.report .toolbar>div{display:flex;gap:6px;flex-wrap:wrap}.report select{max-width:100%}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}th:first-child,td:first-child{text-align:left}caption{text-align:left;margin:18px 0 5px;font-weight:650}
.agenda{--paper:#22132e;--ink:#fff0d7;--rule:#845e87;--focus:#a9f2c3}.agenda .mast span:first-child{font-weight:850;text-transform:uppercase;letter-spacing:.09em}.agenda .hero{background:#f38e71;color:#2b153b;margin:16px 0 28px;min-height:310px;padding:clamp(25px,4.4vw,70px);grid-template-columns:1.1fr 1fr;align-items:center;overflow:hidden}.agenda .hero-copy{position:relative;z-index:1}.agenda h1{font-weight:900;font-size:clamp(76px,8vw,130px);max-width:4.4em}.agenda #cover{height:100%;display:grid;place-items:center;position:relative}.rosette{width:min(31vw,430px);aspect-ratio:1.3;position:relative;isolation:isolate}.rosette i{position:absolute;inset:0 10%;border-radius:50%;background:repeating-radial-gradient(ellipse at center,#2b153b 0 2px,transparent 3px 7px);transform:rotate(-33deg)}.rosette i+i{transform:translateX(12%) rotate(41deg);mix-blend-mode:multiply}.agenda .row{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center}.agenda time{color:#ffae8c;font-size:1.35rem}.agenda .row small{display:block;color:#e5bbda}.agenda .row h3{font-size:clamp(20px,2.6vw,36px)}.agenda .row p{color:#dfc8df}.agenda .status{color:#ffd3b8}
@media(max-width:700px){.samples .hero,.report .hero{grid-template-columns:1fr;gap:22px}.samples .hero h1{max-width:13ch}.samples .hero-copy p,.agenda .hero-copy p{margin-top:12px}.samples .row{grid-template-columns:38px 1fr auto;gap:11px}.swatch{width:36px;height:44px}.samples .sample-info{grid-column:2/-1;grid-row:2}.qty{min-width:1ch}.samples .row .controls{gap:3px}.samples .row button{padding-inline:10px}.agenda .hero{min-height:255px;grid-template-columns:1.6fr 1fr;padding:24px}.agenda h1{font-size:clamp(46px,12vw,78px)}.agenda .hero-copy p{font-size:14px}.rosette{width:35vw}.agenda .row{grid-template-columns:1fr auto;gap:8px}.agenda .row time{grid-column:1/-1}.report .hero{padding:22px}.big{font-size:72px}.series{grid-template-columns:74px 1fr;gap:8px}.barline{grid-template-columns:1fr 44px;gap:8px}.mast{padding:15px 0}.toolbar{align-items:flex-start}}
@media print{button,.toolbar,.summary,.status{display:none!important}body{background:white;color:black}main{max-width:none}.row{break-inside:avoid}}
</style></head>
<body class="agenda"><main><header class="mast"><span id="brand"></span><span id="edition"></span></header><div class="hero"><div class="hero-copy"><h1 id="headline"></h1><p id="intro"></p></div><div id="cover"></div></div><section id="desk" aria-label="Workspace"></section><footer id="credit"></footer></main>
<script id="brief" type="application/json">{"kind": "agenda", "id": "night-school", "title": "Night School", "edition": "夜校 / 冬季课表", "headline": "今晚开印", "intro": "想印一张自己的海报？先挑一堂课，看看散场后还赶得上哪一桌", "source": "虚构工作坊 · 课程与场地仅供演示", "timezone": "Asia/Shanghai", "items": [{"id": "ink", "name": "把两种油墨叠在一起", "track": "印刷桌", "place": "一层 · 长桌", "start": "2026-12-12T18:30:00+08:00", "end": "2026-12-12T19:15:00+08:00", "note": "从一张单色稿开始，试印第二层时把纸挪开两毫米"}, {"id": "type", "name": "用活字排一张店招", "track": "字房", "place": "二层 · 字架", "start": "2026-12-12T18:45:00+08:00", "end": "2026-12-12T19:30:00+08:00", "note": "从字盘里挑六个字，排好后带走一张手印样"}, {"id": "poster", "name": "晚场海报套印", "track": "印刷桌", "place": "一层 · 长桌", "start": "2026-12-12T19:30:00+08:00", "end": "2026-12-12T20:15:00+08:00", "note": "把第一桌留下的底色压进第二张网版，套印一张双色海报"}, {"id": "bind", "name": "折一本口袋刊", "track": "字房", "place": "二层 · 装订台", "start": "2026-12-12T20:15:00+08:00", "end": "2026-12-12T21:00:00+08:00", "note": "拿一张单面印刷的大纸，折出八页口袋刊"}]}</script><script>const brief = JSON.parse(document.querySelector('#brief').textContent)
const get = id => document.getElementById(id)
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const storageKey = 'joey-scenario/' + brief.kind + '/' + brief.id
function readSaved(){
  try {return JSON.parse(localStorage.getItem(storageKey)) || {}} catch {return {}}
}
function save(value){
  try {localStorage.setItem(storageKey, JSON.stringify(value))} catch {}
}
function download(name, type, content){
  const url = URL.createObjectURL(new Blob([content], {type}))
  const link = document.createElement('a')
  link.href = url
  link.download = name
  document.body.append(link)
  link.click()
  link.remove()
  setTimeout(() => URL.revokeObjectURL(url), 2000)
}
for(const [target, field] of Object.entries({brand:'title',edition:'edition',headline:'headline',intro:'intro',credit:'source'})){
  get(target).textContent = brief[field]
}
const desk = get('desk')
const items = brief.items
function samples(){
  const photo = new Image()
  photo.alt = brief.alt
  photo.src = brief.image
  get('cover').append(photo)
  const saved = readSaved()
  const quantities = Object.fromEntries(items.map(item => [item.id, Math.min(9,Math.max(0,Number.parseInt(saved?.[item.id],10) || 0))]))
  desk.innerHTML = '<div class="bar"><h2>Choose your cuts</h2><span class="meta">Sample request</span></div>' +
    items.map(item => `<div class="row"><span aria-hidden="true" class="swatch" style="--swatch:${esc(item.color)}"></span><div><small>${esc(item.code)}</small><h3>${esc(item.name)}</h3></div><div class="sample-info"><strong>${esc(item.spec)}</strong><p>${esc(item.note)}</p></div><div class="controls"><button data-step="-1" data-id="${esc(item.id)}" aria-label="Remove one ${esc(item.name)}">−</button><span class="qty num" id="q-${esc(item.id)}"></span><button data-step="1" data-id="${esc(item.id)}" aria-label="Add one ${esc(item.name)}">+</button></div></div>`).join('') +
    '<div class="summary"><p role="status" id="total"></p><button class="solid" id="export">Download request (.txt)</button></div>'
  function render(){
    const total = Object.values(quantities).reduce((sum,n) => sum+n,0)
    get('total').textContent = total ? total + (total===1 ? ' cut selected' : ' cuts selected') : 'Choose a cut to start your request'
    get('export').disabled = total===0
    for(const item of items) get('q-'+item.id).textContent = quantities[item.id]
    desk.querySelectorAll('[data-step]').forEach(b => {
      const n = quantities[b.dataset.id]
      b.disabled = b.dataset.step==='1' ? n>=9 : n===0
    })
  }
  desk.addEventListener('click',e => {
    const b = e.target.closest('[data-step]')
    if(!b) return
    quantities[b.dataset.id] += Number(b.dataset.step)
    save(quantities)
    render()
  })
  get('export').onclick = () => {
    const cuts = items.filter(i=>quantities[i.id]).map(i => `${i.code} | ${i.name} | ${i.spec} | ${quantities[i.id]} cut(s)`)
    download(brief.id+'-request.txt','text/plain;charset=utf-8',[brief.title,'Sample request','',...cuts,'','Please confirm availability and shipping before dispatch.','',brief.source].join('\r\n'))
  }
  render()
}
function report(){
  const metrics = [brief.metrics.visits, brief.metrics.actions, brief.metrics.rate]
  const read = (pair, metric) => metric===2 ? (pair[0] ? pair[1]*100/pair[0] : null) : pair[metric]
  const display = (n, metric) => n===null ? '无基数' : metric===2 ? n.toFixed(1)+'%' : n.toLocaleString('zh-CN')
  let metric = 1
  desk.innerHTML = `<div class="bar"><h2>两周对照</h2><span>${esc(brief.previous)} / ${esc(brief.current)}</span></div>
    <div class="toolbar"><div aria-label="指标">${metrics.map((m,i)=>`<button data-metric="${i}">${m}</button>`).join('')}</div><select aria-label="渠道" id="channel"><option value="">全部渠道</option>${items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('')}</select></div>
    <div class="legend"><span><i></i>上期</span><span><i></i>本期</span></div><div id="chart" class="compare"></div><div class="table-wrap"><table><caption>渠道明细</caption><thead><tr><th>渠道</th><th>上期</th><th>本期</th><th>变化</th></tr></thead><tbody id="rows"></tbody></table></div><div class="summary"><span id="scope" role="status"></span><button id="export">下载当前 CSV</button></div>`
  function selected(){return items.filter(i => !get('channel').value || i.id===get('channel').value)}
  function render(){
    const rows = selected()
    const sum = rows.reduce((a,r)=>[a[0]+r.current[0],a[1]+r.current[1]],[0,0])
    get('cover').innerHTML = `<strong class="big">${display(read(sum,metric),metric)}</strong><span>本期${metrics[metric]} · ${esc(get('channel').selectedOptions[0].textContent)}</span>`
    desk.querySelectorAll('[data-metric]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.metric)===metric))
    const max = Math.max(1,...rows.flatMap(i=>[read(i.previous,metric),read(i.current,metric)]))
    get('chart').innerHTML = rows.map(i => `<div class="series"><strong>${esc(i.name)}</strong><div class="bars">${['previous','current'].map(key => {
      const n = read(i[key],metric)
      return `<div class="barline ${key}"><span class="track"><i class="length" style="width:${100*(n||0)/max}%"></i></span><small class="num">${display(n,metric)}</small></div>`
    }).join('')}</div></div>`).join('')
    get('rows').innerHTML = rows.map(i=>{
      const a=read(i.previous,metric), b=read(i.current,metric)
      const delta=a===null||b===null ? '无基数' : (b>a?'+':'')+(metric===2?(b-a).toFixed(1)+' 个百分点':(b-a).toLocaleString('zh-CN'))
      return `<tr><th scope="row">${esc(i.name)}</th><td>${display(a,metric)}</td><td>${display(b,metric)}</td><td>${delta}</td></tr>`
    }).join('')
    get('scope').textContent = '当前指标 · '+metrics[metric]+' / '+rows.length+' 个渠道'
  }
  desk.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=Number(b.dataset.metric);render()})
  get('channel').onchange = render
  get('export').onclick = () => {
    const field = v => '"'+(typeof v === 'number' ? String(v) : String(v).replace(/^[=+@-]/,"'$&")).replace(/"/g,'""')+'"'
    const records = [['渠道','指标',brief.previous,brief.current,metric===2?'变化（百分点）':'变化','上期'+metrics[0],'上期'+metrics[1],'本期'+metrics[0],'本期'+metrics[1]]]
    for(const i of selected()){
      const a=read(i.previous,metric), b=read(i.current,metric)
      const raw=n=>n===null?'':metric===2?n.toFixed(1)+'%':n
      const delta=a===null||b===null?'':metric===2?Number((b-a).toFixed(1)):b-a
      records.push([i.name,metrics[metric],raw(a),raw(b),delta,...i.previous,...i.current])
    }
    download(brief.id+'-report.csv','text/csv;charset=utf-8','\uFEFF'+records.map(r=>r.map(field).join(',')).join('\r\n'))
  }
  render()
}
function agenda(){
  get('cover').innerHTML = '<div aria-hidden="true" class="rosette"><i></i><i></i></div>'
  const overlap = (a,b) => Date.parse(a.start)<Date.parse(b.end) && Date.parse(b.start)<Date.parse(a.end)
  const stored = readSaved()
  const chosen = new Set()
  for(const item of items){
    if(Array.isArray(stored) && stored.includes(item.id) && !items.some(i=>chosen.has(i.id)&&overlap(i,item))) chosen.add(item.id)
  }
  const tracks = [...new Set(items.map(i=>i.track))]
  const clock = new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:brief.timezone})
  const date = new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric',timeZone:brief.timezone})
  let track = ''
  desk.innerHTML = `<div class="bar"><h2>挑一堂课</h2><span>${esc(brief.timezone)}</span></div><div class="toolbar"><div class="controls">${['',...tracks].map(t=>`<button data-track="${esc(t)}">${esc(t||'全部场地')}</button>`).join('')}</div></div><div id="sessions"></div><div class="summary"><span id="count"></span><button class="solid" id="export">导出我的日历 (.ics)</button></div><p class="status" role="status" id="notice"></p>`
  function render(){
    desk.querySelectorAll('[data-track]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.track===track))
    get('sessions').innerHTML = items.filter(i=>!track||i.track===track).map(i=>`<div class="row"><time datetime="${esc(i.start)}"><small>${date.format(new Date(i.start))}</small>${clock.format(new Date(i.start))}<small>至 ${clock.format(new Date(i.end))}</small></time><div><small>${esc(i.track)} / ${esc(i.place)}</small><h3>${esc(i.name)}</h3><p>${esc(i.note)}</p></div><button data-session="${esc(i.id)}" aria-pressed="${chosen.has(i.id)}" aria-label="${chosen.has(i.id)?'移出':'加入'} · ${esc(i.name)}">${chosen.has(i.id)?'移出课表':'加入课表'}</button></div>`).join('')
    get('count').textContent='我的课表 · '+chosen.size+' 堂'
    get('export').disabled=!chosen.size
  }
  desk.addEventListener('click',e=>{
    const b=e.target.closest('button')
    if(!b) return
    if(b.hasAttribute('data-track')){track=b.dataset.track;render();return}
    if(!b.dataset.session) return
    const id=b.dataset.session, item=items.find(i=>i.id===id)
    if(chosen.delete(id)){get('notice').textContent='已移出「'+item.name+'」'}
    else {
      const clash=items.find(i=>chosen.has(i.id)&&overlap(i,item))
      if(clash){get('notice').textContent='与「'+clash.name+'」撞时了，先移出那堂再换课';return}
      chosen.add(id)
      get('notice').textContent='已加入「'+item.name+'」'
    }
    save([...chosen]);render()
    desk.querySelector('[data-session="'+id+'"]').focus()
  })
  const stamp = s => new Date(s).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')
  const ical = s => s.replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/[,;]/g,'\\$&')
  function fold(line){
    let result='', length=0
    for(const ch of line){
      const size=new TextEncoder().encode(ch).length
      if(length+size>75){result+='\r\n ';length=1}
      result+=ch;length+=size
    }
    return result
  }
  get('export').onclick=()=>{
    const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Joey Design//Programme//EN','CALSCALE:GREGORIAN']
    for(const i of items.filter(i=>chosen.has(i.id))){
      lines.push('BEGIN:VEVENT','UID:'+brief.id+'-'+i.id+'@joey-design.local','DTSTAMP:'+stamp(Date.now()),'DTSTART:'+stamp(i.start),'DTEND:'+stamp(i.end),'SUMMARY:'+ical(i.name),'LOCATION:'+ical(i.place),'DESCRIPTION:'+ical(i.note),'END:VEVENT')
    }
    lines.push('END:VCALENDAR')
    download(brief.id+'.ics','text/calendar;charset=utf-8',lines.map(fold).join('\r\n')+'\r\n')
  }
  render()
}
if(brief.kind==='samples') samples()
if(brief.kind==='report') report()
if(brief.kind==='agenda') agenda()
</script></body></html>
