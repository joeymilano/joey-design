name: Design review
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install renderer and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r skills/joey-design/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run unit checks
        run: python -m unittest discover -s tests -v
      - name: Exercise the four demos and capture the anonymous entries
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for demo in listening-room contact-sheet stillroom last-ferry; do
            python skills/joey-design/scripts/joey.py review "docs/$demo.html" --journey "skills/joey-design/assets/journeys/$demo.json" --out "captures/$demo" || rc=1
          done
          for entry in a b c d e; do
            python skills/joey-design/scripts/joey.py review "docs/field-test/$entry.html" --journey "tests/journeys/$entry.json" --out "captures/$entry" || rc=1
          done
          exit "$rc"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: design-review
          path: captures/
